[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "durable-agentic-os"
version = "1.0.0"
description = "A durable operating system for agentic AI and autonomous financial systems powered by Temporal, MCP, and multi-provider LLM gateways"
readme = "README.md"
authors = [
    { name = "Manoj Elumalai", email = "manoj.elumalai@outlook.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["temporal", "agents", "durable-execution", "mcp", "trading", "workflow", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "temporalio>=1.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "typing-extensions>=4.11.0"
]
[project.scripts]
durable-agent = "durable_agent.cli:main"

[project.urls]
Homepage = "https://github.com/manojelumalai/durable-agentic-os"
Repository = "https://github.com/manojelumalai/durable-agentic-os"
Issues = "https://github.com/manojelumalai/durable-agentic-os/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/durable_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "RUF"]
ignore = ["E501"]
[tool.ruff.lint.isort]
known-first-party = ["durable_agent"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
ignore_missing_imports = true
files = ["src"]

[tool.coverage.run]
source = ["durable_agent"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
